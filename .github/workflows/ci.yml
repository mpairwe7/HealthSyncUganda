name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check app tests

      - name: Type check (mypy)
        run: uv run mypy app
        continue-on-error: true  # mypy strict baseline is in progress; CI surfaces issues without failing yet

      - name: Tests (pytest)
        run: uv run pytest -q --tb=short

  frontend:
    name: Frontend (Bun)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint
        continue-on-error: true  # eslint config requires next config; failures surface but don't block

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          NEXT_PUBLIC_APP_NAME: HealthSync Uganda

  dependency-audit:
    name: Dependency audit (OSV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --lockfile=backend/uv.lock
            --lockfile=frontend/bun.lock
            --recursive

  # Verify the Dockerfiles still build on every PR. We do not push here —
  # the GHCR push happens in build-push.yml only on main and v* tags.
  docker-build:
    name: Docker build verify (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backend
            context: backend
            dockerfile: backend/Dockerfile
          - app: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: healthsync-${{ matrix.app }}:ci-verify
          cache-from: type=gha,scope=${{ matrix.app }}-verify
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-verify
