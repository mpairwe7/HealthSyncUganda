[project]
name = "healthsync-uganda"
version = "0.1.0"
description = "Interoperable National Digital Health Platform for Uganda"
readme = "../README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "HealthSync Uganda Team" }]

dependencies = [
    # Web framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",          # fallback for laptop demos w/o postgres
    "alembic>=1.13.0",
    # Cache / queue / idempotency
    "redis[hiredis]>=5.2.0",
    # Resilience
    "tenacity>=9.0.0",
    "purgatory>=3.0.0",           # async circuit breaker
    "httpx>=0.27.0",
    # Auth / security
    "bcrypt>=4.0.0",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.12",
    # Observability
    "opentelemetry-api>=1.42.1",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.42.1",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-redis>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "structlog>=24.4.0",
    # FHIR
    "fhir.resources>=8.0.0",
    # Misc
    "orjson>=3.10.0",
    "python-ulid>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.15.14",
    "mypy>=1.13.0",
    "freezegun>=1.5.0",
    # Sync Postgres driver — required by Alembic when running migrations
    # against a Postgres database (Alembic itself is sync-only; asyncpg
    # is async-only). Only needed at migration time, not at app runtime.
    "psycopg[binary]>=3.2.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "ASYNC", "RUF"]
# S101 assert (we use it in tests); S104 0.0.0.0 (intentional in container).
# B008 function-call in default — FastAPI Depends() is the idiomatic pattern.
# S311 non-crypto random — we only use it for retry jitter, not security.
ignore = ["S101", "S104", "B008", "S311"]

[tool.ruff.lint.per-file-ignores]
# FHIR R4 field names are mandated camelCase by HL7; the validator names must
# match the wire format exactly.
"app/fhir/*.py" = ["N815"]
# Schemas declare FastAPI request/response models — Pydantic field alias names
# must match the JSON-on-the-wire shape, so camelCase is intentional here too.
"app/schemas/*.py" = ["N815"]
# Tests legitimately use hardcoded demo passwords.
"tests/*.py" = ["S105", "S106"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # FastAPI deprecation: ORJSONResponse class no longer needed once we
    # rely on response_model/return-type. Tracked, not blocking.
    "ignore::DeprecationWarning:fastapi.*",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
